name: MacePractice
version: 1.2.0
main: dev.macepractice.MacePractice
api-version: '26.2'
load: STARTUP
description: Arena + practice bot for mace PvP
commands:
  bot:
    description: Open the bot settings menu
    aliases: [menu, settings]
  kit:
    description: Refill your kit
    aliases: [refill]
  resetbot:
    description: Respawn your practice bot
  savekit:
    description: Save your current inventory arrangement as your kit layout
    aliases: [savelayout]
  resetkit:
    description: Reset your kit layout to the default
  stats:
    description: Show your practice stats
  mode:
    description: Switch between Mace PvP and Crystal PvP
    aliases: [cpvp, crystal]
